  footer{text-align:center;padding:22px 0 34px;border-top:1px solid var(--sand);

let lang='en', filter='all', query='';

function bluenum(s){ return String(s).replace(/([0-9]+(?:[.,][0-9]+)*%?)/g, '<span class="num">$1</span>'); }
function totals(){
  let n=0; TALENTS.forEach(function(c){ n+=c.t.length; });
  return {champs:TALENTS.length, talents:n};
}
function draw(){
  const box=document.getElementById('list'); box.innerHTML='';
  let html='';
  const q=query.trim().toLowerCase();
  let shown=0;
  TALENTS.forEach(function(c){
    const hits=c.t.filter(function(t){
      if(filter!=='all' && t.s!==filter) return false;
      if(!q) return true;
      return (c.c+' '+t.n+' '+t.d+' '+t.i).toLowerCase().indexOf(q)>=0;
    });
    if(!hits.length) return;
    shown+=hits.length;
    html+='<div class="ch">'+c.c.toUpperCase()+'</div>';
    // Group into EXISTING / HIDDEN and print each as a plain run of lines,
    // so the whole thing reads like one long text file you can select and copy.
    ['live','hidden','other','note'].forEach(function(grp){
      const rows=hits.filter(function(t){ return t.s===grp; });
      if(!rows.length) return;
      const label = grp==='live' ? (lang==='es'?'EXISTENTES':'EXISTING')
                  : grp==='hidden' ? (lang==='es'?'OCULTOS':'HIDDEN')
                  : (lang==='es'?'NOTAS':'NOTES');
      html+='<div class="sec">'+label+'</div>';
      rows.forEach(function(t){
        html+='<div class="row"><span class="id" data-id="'+t.i+'" title="click to copy">'+t.i+'</span> '
          +'<span class="nm">'+bluenum(t.n)+'</span>'
          +(t.d?' <span class="ds">&mdash; '+bluenum(t.d)+'</span>':'')+'</div>';
      });
    });
  });
  if(!shown) box.innerHTML='<div class="none">No matches.</div>';
  else { const s=document.createElement('div'); s.className='sheet'; s.innerHTML=html; box.appendChild(s); }
  box.querySelectorAll('.id').forEach(function(el){
    el.addEventListener('click',function(){
      const v=el.dataset.id;
      const done=function(){
        const t=document.getElementById('toast');
        t.textContent=(lang==='es'?'ID copiado: ':'Copied ID: ')+v;
        t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1500);
      };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(v).then(done).catch(done);
      } else { done(); }
    });
  });
}
function render(){
  const L=I18N[lang]; document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const k=el.dataset.i18n; if(L[k]) el.innerHTML=L[k];
  });
  document.getElementById('q').placeholder=L.ph.replace(/&[a-z]+;/g,'');
  const st=document.getElementById('steps'); st.innerHTML='';
  L.steps.forEach(function(s){ const li=document.createElement('li'); li.innerHTML=s; st.appendChild(li); });
  const T=totals();
  document.getElementById('counts').textContent =
    T.talents+(lang==='es'?' talentos · ':' talents · ')+T.champs+(lang==='es'?' campeones':' champions');
  document.querySelectorAll('.lang').forEach(function(b){b.classList.toggle('on',b.dataset.lang===lang);});
  draw();
}
document.querySelectorAll('.lang').forEach(function(b){
  b.addEventListener('click',function(){ lang=b.dataset.lang; render(); });});
document.querySelectorAll('.fbtn').forEach(function(b){
  b.addEventListener('click',function(){
    filter=b.dataset.f;
    document.querySelectorAll('.fbtn').forEach(function(x){x.classList.toggle('on',x===b);});
    draw();
  });});
document.getElementById('q').addEventListener('input',function(e){ query=e.target.value; draw(); });
render();
</script>
